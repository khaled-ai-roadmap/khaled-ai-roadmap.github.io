<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مركز المهارات: من الصفر للاحتراف</title><meta name="description" content="مسارات تعلم مجانية من الصفر للاحتراف بجدول يومي 3 ساعات، متابعة تقدم، مشاريع، واختبارات. المسار الجاهز: AI Engineering."><meta name="theme-color" content="#fbf7f2">
<style>
:root{--bg:#fbf7f2;--card:#fff;--ink:#2b2a33;--mut:#6b6a75;--line:#eee7df;--teal:#2f9e8f;--sun:#ffb703;--coral:#ff8a65;--soft:#f3ece4;--r:20px}
@media(prefers-color-scheme:dark){:root{--bg:#1d1c22;--card:#27262e;--ink:#ece9e4;--mut:#aaa7b3;--line:#35343d;--soft:#2f2e37}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif;padding-bottom:84px}
main{max-width:760px;margin:0 auto;padding:16px 16px 24px}
h1{font-size:28px;margin:6px 0}h2{font-size:22px;margin:24px 0 8px}h3{font-size:18px;margin:0 0 4px}p{margin:8px 0}
a{color:#1a73c8}.sub,.meta{color:var(--mut);font-size:14px}.fine{color:var(--mut);font-size:13px;margin-top:24px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .5s ease}
.hello{display:flex;gap:12px;align-items:center;margin:8px 0}.owl{font-size:40px;line-height:1;animation:bob 4s ease-in-out infinite}.owl.big{font-size:64px}
@keyframes bob{50%{transform:translateY(-4px)}}
.hero{text-align:center;padding:12px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 2px 0 var(--line)}.card.big{padding:20px}.center{text-align:center}.bigem{font-size:56px;line-height:1.2}
.blk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ck{flex:none;width:44px;height:44px;border-radius:14px;border:2px solid #c9c2ba;background:var(--card);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s}
.ck[aria-pressed=true]{background:var(--teal);border-color:var(--teal);animation:pop .3s ease}
@keyframes pop{40%{transform:scale(1.12)}}
.blk.done .bh{color:var(--mut);text-decoration:line-through}.bt{flex:1;min-width:0}.bh{font-weight:600}
.lks{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lnk{display:inline-flex;min-height:36px;align-items:center;background:var(--soft);border-radius:12px;padding:2px 12px;text-decoration:none;font-size:14px;margin:4px 0;overflow-wrap:anywhere}
.note{background:#fff4d6;color:#4a3b00;border-radius:16px;padding:12px 16px;margin:12px 0}.note.warn{background:#ffe9e0;color:#5a2a14}
@media(prefers-color-scheme:dark){.note{background:#4a3f1c;color:#ffe9a8}.note.warn{background:#4d2f24;color:#ffd9c7}.lnk{color:#8ab4f8}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.mini b{display:block;font-size:20px}.mini span{color:var(--mut);font-size:13px}
.peek{background:var(--soft);border-radius:14px;padding:8px 14px;margin:6px 0}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font:inherit;font-size:15px;cursor:pointer;margin:4px 0}.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.danger{color:#c62828;border-color:#c62828}
.back{display:inline-block;margin:8px 0;text-decoration:none}.pager{display:flex;justify-content:space-between;gap:8px;margin:16px 0;flex-wrap:wrap}
.ph{display:flex;gap:12px;align-items:center;justify-content:space-between}.em{font-size:32px}.ph>div{flex:1}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0}
.wk{display:flex;flex-direction:column;background:var(--soft);border-radius:14px;padding:8px 10px;text-decoration:none;color:var(--ink);font-size:13px;line-height:1.4;min-height:44px}.wk b{font-size:16px}.wk.full{background:#d9f2ec;color:#14574c}
@media(prefers-color-scheme:dark){.wk.full{background:#1f4a43;color:#cdeee7}}
.stat{color:#fff;border-radius:99px;padding:0 12px;font-size:13px;white-space:nowrap;flex:none}
dl{margin:8px 0}dt{font-weight:700;margin-top:8px}dd{margin:0;color:var(--mut)}
pre{direction:ltr;text-align:left;background:var(--soft);padding:12px;border-radius:12px;overflow-x:auto;font-size:13px;white-space:pre-wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.bd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;opacity:.55}.bd.on{opacity:1;border-color:var(--sun)}.bd span{font-size:30px;display:block}.bd small{display:block;color:var(--mut);font-size:12px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sk{display:flex;flex-direction:column;gap:4px;background:var(--card);border:2px solid var(--c);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);transition:transform .2s;min-height:150px}.sk:hover{transform:translateY(-2px)}.sk.soon{border-style:dashed;opacity:.85}.sk .em{font-size:36px}.sk small{color:var(--mut);font-size:13px;line-height:1.4}.tag{margin-top:auto;font-size:12px;background:var(--c);color:#fff;border-radius:99px;padding:0 10px;align-self:flex-start}
.inp{display:block;width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;background:var(--card);color:var(--ink);margin:8px 0}
.opt{display:flex;gap:10px;align-items:center;min-height:44px;padding:4px 0;cursor:pointer}.opt input{width:20px;height:20px}
.exp{font-size:14px;margin-top:6px}.exp.ok{color:#1b7f4a}.exp.bad{color:#c0392b}
.aud{border-top:1px solid var(--line);padding:8px 0}.aud p{margin:2px 0;color:var(--mut);font-size:14px}
.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabs a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;min-height:50px;justify-content:center;font-size:12px;color:var(--mut);text-decoration:none;border-radius:14px}.tabs a span{font-size:22px;line-height:1.1}.tabs a[aria-current=page]{color:var(--teal);background:var(--soft);font-weight:700}
#toast{position:fixed;bottom:96px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#2b2a33;color:#fff;border-radius:14px;padding:8px 16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid #1a73c8;outline-offset:2px}
noscript{display:block;padding:20px}
.hf{display:flex;gap:8px}.hf input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}.hch{width:100%;height:auto;max-height:150px;display:block;margin:8px 0}.hgrid{overflow-x:auto}.hrow{display:grid;grid-template-columns:minmax(78px,1.5fr) repeat(7,minmax(0,1fr)) 22px;gap:4px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.hhead{border:0;font-size:11px;color:var(--mut);text-align:center}.hn{font-weight:700;font-size:14px;line-height:1.3}.hn small{display:block;font-weight:400;color:var(--mut);font-size:11px}.hc{aspect-ratio:1;min-width:0;width:100%;padding:0;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:#fff;font-size:16px;cursor:pointer;transition:transform .15s,background .2s}.hc.on{background:var(--teal);border-color:var(--teal)}.hc:active{transform:scale(.88)}.hx{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px}.tabs a{font-size:11px}.hsel{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{font:inherit;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:all .15s}.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}.chip:active{transform:scale(.95)}</style></head><body><main id="view"><noscript>الموقع محتاج JavaScript عشان يشتغل.</noscript></main>
